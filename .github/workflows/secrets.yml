name: Secrets

# Secret scanning with gitleaks. GitHub secret scanning is not available on
# this repo, so this job is the replacement. It downloads a pinned gitleaks
# release binary and verifies it against the release's published sha256
# checksums before running it (no third-party actions).
#
# Scan range:
#   pull_request      -> only the PR's commits (base..head)
#   push (main)       -> only the pushed commits (before..after)
#   workflow_dispatch -> the full history

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          v="${GITLEAKS_VERSION}"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${v}"
          tarball="gitleaks_${v}_linux_x64.tar.gz"
          dir="$(mktemp -d)"
          cd "$dir"
          curl -fsSL --retry 3 -o "$tarball" "${base}/${tarball}"
          curl -fsSL --retry 3 -o checksums.txt "${base}/gitleaks_${v}_checksums.txt"
          grep -E "  ${tarball}\$" checksums.txt > expected.txt
          sha256sum -c expected.txt
          tar -xzf "$tarball" gitleaks
          install -m 0755 gitleaks "${RUNNER_TEMP}/gitleaks"
          "${RUNNER_TEMP}/gitleaks" version

      - name: Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          range=""
          case "$EVENT_NAME" in
            pull_request)
              range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
              ;;
            push)
              # New branch or a 'before' commit that is no longer reachable
              # (force push): fall back to scanning the full history.
              if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
                 && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                range="${PUSH_BEFORE}..${PUSH_AFTER}"
              fi
              ;;
          esac
          if [ -n "$range" ]; then
            echo "Scanning commits in ${range}"
            "${RUNNER_TEMP}/gitleaks" git --redact --exit-code 1 --no-banner --log-opts="${range}" .
          else
            echo "Scanning the full history"
            "${RUNNER_TEMP}/gitleaks" git --redact --exit-code 1 --no-banner .
          fi
